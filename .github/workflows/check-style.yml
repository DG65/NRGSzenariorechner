name: Check Style

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: PHP Syntax-Check
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l
      # Eigene Schleife: ein grüner Haken muss heißen "alle Prüfstände grün", nicht "der
      # letzte war grün" (SUITE.md, Falle bei check-style.yml) - Fehlschläge zählen und am
      # Ende explizit abbrechen, nicht auf set -e verlassen.
      - name: Prüfstände (Eigenständigkeit, Formular, Rechnung)
        run: |
          fails=0
          for t in .tools/check-standalone.php .tools/test-form.php .tools/test-scenarios.php; do
            php "$t" || fails=$((fails+1))
          done
          exit $((fails > 0 ? 1 : 0))
